<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Stirling Ridge Walk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #b45309 0%, #ea580c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { color: #1e293b; margin-bottom: 12px; font-size: 24px; }
    p { color: #64748b; margin-bottom: 24px; line-height: 1.6; }
    .tip {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-radius: 8px;
      padding: 16px;
      text-align: left;
      font-size: 14px;
    }
    .tip h3 { color: #92400e; margin-bottom: 8px; }
    .tip ul { color: #78350f; padding-left: 20px; }
    .tip li { margin: 4px 0; }
    .retry-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #b45309;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .retry-btn:hover { background: #92400e; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🏔️</div>
    <h1>You're Offline</h1>
    <p>No worries - the Stirling Ridge Walk app works offline once cached!</p>
    
    <div class="tip">
      <h3>💡 Offline Tips:</h3>
      <ul>
        <li>Open the app while online first to cache it</li>
        <li>Browse the map to cache tiles for your route</li>
        <li>Download the GPX file to your device</li>
        <li>Use the GPS feature - it works without internet!</li>
      </ul>
    </div>
    
    <button class="retry-btn" onclick="window.location.reload()">
      Try Again
    </button>
  </div>
</body>
</html>
